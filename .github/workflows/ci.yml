name: CI

on:
  push:
    branches: [main, quant-pivot]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -q

      # The cached price history is committed, so the research pipeline runs
      # end to end in CI without touching the network. This is the real
      # regression test: it proves the published figures reproduce.
      - name: Reproduce research results from cached data
        run: python app.py --research-only

      - name: Build static site
        run: python build_static.py
